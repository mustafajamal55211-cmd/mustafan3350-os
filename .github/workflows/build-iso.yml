name: Build MustafaN3350 ISO
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Speicherplatz auf GitHub-Server freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          docker image prune -af

      - name: Echte Debian Trixie ISO bauen
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work debian:trixie bash -e -c '
            export DEBIAN_FRONTEND=noninteractive
            sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/g" /etc/apt/sources.list.d/debian.sources
            apt-get update
            apt-get install -y live-build squashfs-tools xorriso isolinux syslinux-common dosfstools mtools

            rm -rf config auto .build binary chroot cache
            lb config \
              --distribution trixie \
              --architectures amd64 \
              --linux-flavours amd64 \
              --binary-images iso-hybrid \
              --archive-areas "main contrib non-free non-free-firmware" \
              --bootappend-live "boot=live components locales=de_DE.UTF-8 keyboard-layouts=de quiet splash"

            mkdir -p config/package-lists
            {
              echo "live-boot"
              echo "live-config"
              echo "live-config-systemd"
              echo "systemd-sysv"
              echo "sudo"
              echo "locales"
              echo "console-setup"
              echo "keyboard-configuration"
              echo "network-manager"
              echo "xorg"
              echo "lightdm"
              echo "lightdm-gtk-greeter"
              echo "udisks2"
              echo "gvfs"
              echo "pulseaudio"
              echo "pulseaudio-module-bluetooth"
            } > config/package-lists/custom.list.chroot

            while IFS= read -r pkg || [ -n "$pkg" ]; do
              pkg=$(echo "$pkg" | tr -d "\r" | xargs)
              [ -z "$pkg" ] && continue
              if apt-cache show "$pkg" >/dev/null 2>&1; then
                echo "$pkg" >> config/package-lists/custom.list.chroot
              else
                echo "Überspringe unbekanntes Paket: $pkg"
              fi
            done < packages.txt

            mkdir -p config/includes.chroot/etc/default
            echo "mustafan3350" > config/includes.chroot/etc/hostname
            printf "%s\n" "ALGO=lz4" "PERCENT=50" "PRIORITY=100" > config/includes.chroot/etc/default/zramswap

            mkdir -p config/includes.chroot/etc/sysctl.d
            printf "%s\n" "vm.swappiness=100" "vm.vfs_cache_pressure=50" > config/includes.chroot/etc/sysctl.d/99-speed.conf

            lb build
          '

      - name: ISO als kostenlosen Download (Release) bereitstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_FILE=$(ls -1 live-image-*.iso | head -n1)
          mv "$ISO_FILE" "MustafaN3350.iso"
          ls -lh "MustafaN3350.iso"
          TAG="build-${{ github.run_number }}"
          SIZE=$(stat -c%s "MustafaN3350.iso")
          if [ "$SIZE" -gt 2000000000 ]; then
            split -b 1800M -d "MustafaN3350.iso" "MustafaN3350.iso.part-"
            gh release create "$TAG" MustafaN3350.iso.part-* --title "MustafaN3350 ($TAG)" --notes "Gebaut mit Mustafa Factory!"
          else
            gh release create "$TAG" "MustafaN3350.iso" --title "MustafaN3350 ($TAG)" --notes "Gebaut mit Mustafa Factory!"
          fi
